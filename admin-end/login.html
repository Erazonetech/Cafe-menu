<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bambis Cafe · Admin Sign In</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600..800;1,9..144,600&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="admin-shell login-page-shell">
      <!-- Topbar Header matching Admin Dashboard -->
      <header class="admin-topbar">
        <div class="admin-branding">
          <span class="admin-badge">ADMIN</span>
          <h1 id="brand-header-title">Bambis Cafe</h1>
        </div>

        <div class="admin-topbar-actions">
          <!-- Admin Theme Segmented Toggler (Light / Dark) -->
          <div class="admin-theme-switcher" role="group" aria-label="Admin Interface Theme">
            <button type="button" class="admin-theme-pill active" data-theme-val="light" id="theme-pill-light" title="Switch to Light theme">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <span>Light</span>
            </button>
            <button type="button" class="admin-theme-pill" data-theme-val="dark" id="theme-pill-dark" title="Switch to Dark theme">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
              <span>Dark</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Centered Editorial Login Card -->
      <main class="login-main-container">
        <section class="login-editorial-card">
          <div class="login-card-header">
            <div class="login-shield-badge">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <h2 class="login-card-title">Admin Sign In</h2>
            <p class="login-card-desc">Sign in with your cafe administrator credentials to manage menus, reviews, and store settings.</p>
          </div>

          <!-- LOGIN_ERROR -->

          <form method="post" action="/login" class="login-card-form">
            <label class="login-input-group">
              <span class="login-group-label">Username</span>
              <div class="login-field-wrap">
                <svg class="field-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                <input name="username" id="login-username" autocomplete="username" required autofocus placeholder="Enter admin username" />
              </div>
            </label>

            <label class="login-input-group">
              <span class="login-group-label">Password</span>
              <div class="login-field-wrap">
                <svg class="field-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input name="password" id="login-password" type="password" autocomplete="current-password" required placeholder="Enter password" />
              </div>
            </label>

            <button class="btn-primary login-btn-submit" type="submit">
              <span>Sign In to Dashboard</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </form>
           <div class="login-card-footer">
            <a href="/" class="login-customer-link">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
              </svg>
              <span>Return to Customer Menu</span>
            </a>
          </div>
        </section>
      </main>
    </div>

    <script type="module">
      function getStoredTheme() {
        try { return localStorage.getItem("bambis-theme"); } catch { return null; }
      }
      function applyTheme(theme) {
        if (!theme) {
          document.documentElement.removeAttribute("data-theme");
        } else {
          document.documentElement.setAttribute("data-theme", theme);
        }
        try { localStorage.setItem("bambis-theme", theme || ""); } catch {}
        document.querySelectorAll(".admin-theme-pill").forEach(p => {
          p.classList.toggle("active", p.dataset.themeVal === (theme || "light"));
        });
      }
      const initialTheme = getStoredTheme();
      if (initialTheme) applyTheme(initialTheme);

      document.querySelector("#theme-pill-light")?.addEventListener("click", () => applyTheme("light"));
      document.querySelector("#theme-pill-dark")?.addEventListener("click", () => applyTheme("dark"));
    </script>
  </body>
</html>
